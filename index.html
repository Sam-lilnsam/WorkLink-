 app.innerHTML=`<h2>🛡️ Admin</h2><div class=row>${card('Users',S.users)}${card('Workers',S.workers)}</div><div class=row>${card('Employers',S.employers)}${card('Open jobs',S.jobs_open)}</div><div class=row>${card('Applications',S.applications)}${card('Messages',S.messages)}</div>

async function applicants(id){curTitle=J[id]?.title||'job';
 const{data}=await sb.from('applications').select('*,profiles(full_name,headline,skills,city,country)').eq('job_id',id);const ids=(data||[]).map(a=>a.worker_id);const{data:D}=ids.length?await sb.from('documents').select('*').in('user_id',ids):{data:[]};const dl=u=>(D||[]).filter(d=>d.user_id==u).map(d=>`<button class=g onclick="openDoc('${d.path}')">📄 ${E(d.doc_type)}</button>`).join('')||'<span class=m>No documents uploaded</span>';
 app.innerHTML=`<a onclick="go('jobs')">← Back</a><h2>${E(curTitle)}</h2>${(data||[]).map(a=>`<div class=c><b>${E(a.profiles?.full_name)}</b> <span class=tag>${E(a.status)}</span><div class=m>${E(a.profiles?.headline)} · ${E(a.profiles?.city)} ${E(a.profiles?.country)}</div><div class=m>Skills: ${E(a.profiles?.skills)}</div><p>${E(a.message)}</p><div>${dl(a.worker_id)}</div><button onclick="setApp('${a.id}','shortlisted','${a.worker_id}','${id}')">Shortlist</button><button onclick="setApp('${a.id}','accepted','${a.worker_id}','${id}')">Accept</button><button class=r onclick="setApp('${a.id}','rejected','${a.worker_id}','${id}')">Reject</button><button class=g onclick="chat('${a.worker_id}')">Message</button></div>`).join('')||'<div class=c>No applicants yet.</div>'}`}
async function setApp(id,s,wid,jid){await sb.from('applications').update({status:s}).eq('id',id);notify(wid,`Your application for ${curTitle} was ${s}`);applicants(jid)}
async function saveProfile(){const u={full_name:f('n'),headline:f('h'),bio:f('b'),country:f('co'),city:f('ci'),language:f('lg')};
 if($('sk')){u.skills=f('sk');u.availability=f('av')}
 const{error}=await sb.from('profiles').update(u).eq('id',me.id);error?toast(error.message):(Object.assign(me,u),toast('Saved'))}
async function chat(uid){clearInterval(poll);
 const{data:p}=await sb.from('profiles').select('full_name').eq('id',uid).single();
 app.innerHTML=`<a onclick="go('msg')">← Back</a><h3>${E(p?.full_name)}</h3><div id=log></div><div class=row style="position:sticky;bottom:80px;background:var(--bg)"><input id=mb placeholder="Type a message" style="flex:4"><button onclick="sendMsg('${uid}')">Send</button></div>`;
 const draw=async()=>{const{data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${uid}),and(sender_id.eq.${uid},receiver_id.eq.${me.id})`).order('created_at');
  const l=$('log');if(!l)return clearInterval(poll);l.innerHTML=(data||[]).map(m=>`<div class="b ${m.sender_id==me.id?'me':''}">${E(m.body)}</div>`).join('');l.scrollTop=l.scrollHeight};
 draw();poll=setInterval(draw,4000);window._draw=draw}
async function sendMsg(uid){const b=f('mb');if(!b)return;$('mb').value='';
 await sb.from('messages').insert({sender_id:me.id,receiver_id:uid,body:b});notify(uid,`New message from ${me.full_name}`);window._draw()}
let tm;const deb=fn=>{clearTimeout(tm);tm=setTimeout(fn,300)};
function homeSearch(){window._q=f('hq');go('find')}
async function runWorkers(){
 let q=sb.from('profiles').select('*').eq('role','worker').eq('suspended',false);
 const k=f('wq').replace(/[,()%]/g,' ');
 if(k)q=q.or(`full_name.ilike.%${k}%,headline.ilike.%${k}%,skills.ilike.%${k}%,bio.ilike.%${k}%`);
 if(f('wc'))q=q.eq('country',f('wc'));if(f('wi'))q=q.ilike('city',`%${f('wi').replace(/[,()%]/g,' ')}%`);
 if($('wa').checked)q=q.eq('availability','Available');
 const{data}=await q.order('created_at',{ascending:false}).limit(40);
 $('wres').innerHTML=(data||[]).map(w=>`<div class=c><b>${E(w.full_name)}</b> <span class=tag>${E(w.availability)}</span><div class=m>${E(w.headline)} · ${E(w.city)}${w.city?', ':''}${E(w.country)}</div><p>${(w.skills||'').split(',').filter(x=>x.trim()).map(x=>`<span class=tag>${E(x.trim())}</span>`).join(' ')}</p><p class=m>${E(w.bio).slice(0,140)}</p><button onclick="invite('${w.id}')">⚡ Invite to apply</button><button class=g onclick="chat('${w.id}')">Message</button></div>`).join('')||'<div class=c>No workers match. Try fewer filters.</div>'}
const CONTACT='';const LAST='24 October 2026';
const LG={
terms:['Terms of Service',`<p class=m>Last updated ${LAST}. WorkLink is an early test version.</p>
<h3>1. What WorkLink is</h3><p>WorkLink is an online marketplace where workers and employers can find and contact each other. WorkLink is not an employer, recruiter or staffing agency, and is not a party to any agreement between users. We do not guarantee any job, worker, hire or income.</p>

<h3>6. Your content</h3><p>You own what you post. You give WorkLink permission to store and show it so the service can run. We may remove content or suspend accounts that break these terms or put others at risk.</p>
<h3>7. Payments</h3><p>WorkLink does not process payments. Workers and employers arrange pay between themselves. If paid features are added later, they will come with their own terms.</p>
<h3>8. Service availability</h3><p>The service is provided as is and as available. It may change, pause or lose data, and we give no warranty that it will be error-free or always online.</p>
<h3>9. Limit of liability</h3><p>As far as the law allows, WorkLink is not liable for the conduct of users, for lost income or opportunities, or for indirect losses. Nothing here limits any right or liability that cannot be limited by law.</p>
<h3>10. Ending your use</h3><p>You can stop using WorkLink at any time and ask us to delete your account. We may suspend or remove accounts that break these terms.</p>
<h3>11. Changes</h3><p>We may update these terms. If you keep using WorkLink after a change, you accept the new terms. We will tell users about major changes in the app.</p>
<h3>12. Governing law</h3><p>These terms are governed by the laws of Kenya, without removing any mandatory consumer rights you have where you live.</p>`],
privacy:['Privacy Policy',`<p class=m>Last updated ${LAST}.</p>
<h3>What we collect</h3><p>Your email and password (the password is stored securely, not readable by us), name, country, city, language and time zone. If you add them: headline, bio, skills and availability. Also the jobs you post, applications you send, messages, and notifications.</p>
<h3>How we use it</h3><p>To create your account, show jobs and profiles, connect workers with employers, send verification and reset emails, and keep the service safe. We do not sell your data and we do not show ads.</p>
<h3>Who can see what</h3><ul><li>Worker profile details (name, headline, bio, skills, city, country, availability) can be seen by logged-in users.</li><li>Job listings can be seen by logged-in users.</li><li>Messages can be seen by the two people in the chat. They are not end-to-end encrypted, so people who run the service and its database could technically access them.</li><li>Your email address is not shown to other users.</li><li>Documents you upload (CV, certificates) are private. Employers can open them only if you apply to their job. Do not upload ID numbers or bank details.</li></ul>
<h3>Services we rely on</h3><p>Supabase stores accounts and data and sends emails. GitHub Pages hosts the website and may log visitor technical data such as IP addresses. Your data may be processed in countries other than yours.</p>

<h3>How long we keep it</h3><p>Until you ask us to delete your account, or the account is removed for breaking the rules.</p>
<h3>Your choices</h3><p>You can edit your profile in the app. You can ask to see, correct or delete your data by contacting us. Depending on where you live (for example under the Kenya Data Protection Act or the EU GDPR) you may have more rights, which we will respect.</p>
<h3>Security</h3><p>Data travels over HTTPS and access rules limit what each user can read. No online service is completely secure.</p>
<h3>Age</h3><p>WorkLink is for people 18 and older. Contact us if you believe a child has registered.</p>
<h3>Changes</h3><p>We may update this policy and will tell users about major changes.</p>`],
rules:['Community Rules',`<h3>Be honest</h3><p>Post only real jobs and real information about yourself. Show the true pay and conditions.</p>
<h3>Never charge to hire</h3><p>No fees, deposits or paid kits to apply for a job or get hired. Reporting this is always welcome.</p>
<h3>Treat people with respect</h3><p>No harassment, threats, hate or unfair treatment because of who someone is.</p>
<h3>Keep it legal and safe</h3><p>No illegal work, no exploitation, and no work that puts people in unsafe conditions without proper protection.</p>

safety:['Job Safety Tips',`<h3>If you are looking for work</h3><ul><li>Never pay money to get a job, interview or training.</li><li>Be careful with pay that sounds too good to be true.</li><li>Never share passwords, one-time codes, bank logins or ID photos with someone you have not verified.</li><li>Meet new employers in a public place first and tell someone you trust where you are going.</li><li>Agree pay, hours and tasks in writing before you start.</li></ul>

<h3>If something feels wrong</h3><p>Stop talking to the person, keep screenshots, and contact us. A report button inside the app is planned.</p>`]};
function back(){me?go('me'):authView('login')}
function legal(k){
 if(!k||!LG[k])return app.innerHTML=`<a onclick="back()">← Back</a><h2>Terms, privacy &amp; safety</h2>${Object.keys(LG).map(x=>`<div class=c onclick="legal('${x}')"><b>${LG[x][0]}</b></div>`).join('')}<p class=m>Last updated ${LAST}</p>`;
 app.innerHTML=`<a onclick="legal()">← All documents</a><h2>${LG[k][0]}</h2><div class=legal>${LG[k][1]}</div><p class=m>Contact: ${E(CONTACT)||'support contact coming soon'}</p>`}
async function adminUser(id,k,v){const{error}=await sb.from('profiles').update({[k]:v}).eq('id',id);error?toast(error.message):(toast('Done'),V.admin())}
async function adminJob(id){if(!confirm('Remove this job?'))return;await sb.from('jobs').delete().eq('id',id);V.admin()}
async function closeReport(id){await sb.from('reports').update({status:'dismissed'}).eq('id',id);V.admin()}
async function report(id){const r=prompt('Why are you reporting this job? (fake, asks for money, offensive...)');if(!r)return;const{error}=await sb.from('reports').insert({reporter_id:me.id,job_id:id,reason:r});toast(error?error.message:'Report sent. Thank you.')}
async function invite(wid){const{data}=await sb.from('jobs').select('id,title').eq('employer_id',me.id).eq('status','open').order('created_at',{ascending:false}).limit(1);
 if(!data||!data.length)return toast('Post a job first, then invite workers');const j=data[0];
 await sb.from('messages').insert({sender_id:me.id,receiver_id:wid,body:`Hi! I would like to invite you to apply for ${j.title}. Please open Jobs and apply when you are ready.`});
 notify(wid,`${me.full_name} invited you to apply for ${j.title}`);toast('Invitation sent for '+j.title)}
async function loadDocs(){const{data}=await sb.from('documents').select('*').eq('user_id',me.id).order('created_at',{ascending:false});
 $('docs').innerHTML=`<h3>My documents</h3><p class=m>Upload your CV, certificates and other application papers (PDF, Word or photo, max 5 MB). Employers see them only when you apply to their job. Do not upload ID numbers or bank details.</p>${(data||[]).map(d=>`<div class=c><b>${E(d.doc_type)}</b> · ${E(d.name)}<br><button class=g onclick="openDoc('${d.path}')">View</button><button class=r onclick="delDoc('${d.id}','${d.path}')">Delete</button></div>`).join('')}<select id=dtp>${opt(['CV / Resume','Certificate','Cover letter','Reference letter','Other'])}</select><input id=dfl type=file accept=".pdf,.doc,.docx,image/*"><button onclick="upDoc()">Upload</button>`}
async function upDoc(){const x=$('dfl').files[0];if(!x)return toast('Choose a file first');if(x.size>5242880)return toast('File is over 5 MB');
 const p=`${me.id}/${Date.now()}-${x.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-')}`;
 const{error}=await sb.storage.from('docs').upload(p,x);if(error)return toast(error.message);
 const{error:e2}=await sb.from('documents').insert({user_id:me.id,name:x.name,doc_type:f('dtp'),path:p});if(e2)return toast(e2.message);toast('Uploaded ✓');loadDocs()}
async function delDoc(id,p){if(!confirm('Delete this document?'))return;await sb.storage.from('docs').remove([p]);await sb.from('documents').delete().eq('id',id);loadDocs()}
async function openDoc(p){const{data,error}=await sb.storage.from('docs').createSignedUrl(p,300);if(error)return toast(error.message);window.open(data.signedUrl,'_blank')||(location.href=data.signedUrl)}
boot();
</script></body></html>
