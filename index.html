async function boot(){
 sb=supabase.createClient(CFG.u,CFG.k);

function authView(m){const s=m=='signup';$('nav').style.display='none';

 const{data:sd,error}=await sb.auth.signUp({email:f('em'),password:f('pw'),options:{emailRedirectTo:location.origin+location.pathname,data:{role:f('r'),full_name:f('n'),country:f('co'),city:f('ci'),language:f('lg'),timezone:TZ,terms_accepted:new Date().toISOString()}}});
 error?toast(error.message):sd.session?load(sd.user):app.innerHTML=`<div class=box><h2>Check your email</h2><p>Open the verification link, then log in.</p><button onclick="authView('login')">Log in</button></div>`}
async function login(){const{data,error}=await sb.auth.signInWithPassword({email:f('em'),password:f('pw')});error?toast(error.message):load(data.user)}
async function reset(){const{error}=await sb.auth.resetPasswordForEmail(f('em'),{redirectTo:location.origin+location.pathname});toast(error?error.message:'If that email has an account, a reset link is on its way. Check spam too.')}
function newPw(){app.innerHTML=`<div class=box><h2>New password</h2><input id=pw type=password placeholder="New password"><button onclick="setPw()">Save</button></div>`}
async function setPw(){if(f('pw').length<8)return toast('Use at least 8 characters');const{data,error}=await sb.auth.updateUser({password:f('pw')});if(error)return toast(error.message);rec=false;load(data.user)}
async function logout(){await sb.auth.signOut();me=null;authView('login')}
async function load(u){
 const{data}=await sb.from('profiles').select('*').eq('id',u.id).single();
 if(!data)return toast('Profile missing - run the SQL schema first');
 if(data.suspended){await sb.auth.signOut();return toast('Account suspended')}
 if(!data.country){me=data;return onboard()}me=data;const W=me.role!='employer';
 const T=me.role=='admin'?[['admin','🛡️','Admin'],['find','🔍','Jobs'],['workers','👥','Workers'],['msg','💬','Messages'],['alerts','🔔','Alerts'],['me','👤','Profile']]:W?[['home','🏠','Home'],['find','🔍','Jobs'],['work','💼','My Work'],['msg','💬','Messages'],['alerts','🔔','Alerts'],['me','👤','Profile']]
 :[['home','🏠','Home'],['workers','👥','Workers'],['jobs','💼','My Jobs'],['msg','💬','Messages'],['alerts','🔔','Alerts'],['me','👤','Profile']];
 $('nav').style.display='flex';$('nav').innerHTML=T.map(x=>`<div id=n_${x[0]} onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</div>`).join('');go(me.role=='admin'?'admin':'home')}

const saved=async()=>new Set(((await sb.from('saved_jobs').select('job_id').eq('user_id',me.id)).data||[]).map(x=>x.job_id));
const notify=(uid,text)=>sb.from('notifications').insert({user_id:uid,text});
const av=(u,n,z=44)=>u?`<img class=av src="${E(u)}" alt="" style="width:${z}px;height:${z}px">`:`<span class=av style="width:${z}px;height:${z}px;font-size:${Math.round(z/2.4)}px">${E((n||'?').trim().charAt(0).toUpperCase())}</span>`;
const pay=j=>j.pay_amount?`${E(j.currency)} ${Number(j.pay_amount).toLocaleString()}${j.pay_max?'–'+Number(j.pay_max).toLocaleString():''}${j.pay_period=='fixed'?' fixed':' / '+E(j.pay_period)}`:'Pay negotiable';
const jobCard=(j,S)=>{J[j.id]=j;return`<div class=c><b>${E(j.title)}</b> <span class=tag>${E(j.status)}</span>${j.remote?' <span class=tag>🌍 Remote</span>':''}<div class=m>${av(j.profiles?.avatar_url,j.profiles?.full_name,22)} ${E(j.profiles?.full_name)} ${j.profiles?.verified?'':'<span class=tag>⚠️ Flagged by admin</span>'} · ${E(j.city)}${j.city?', ':''}${E(j.country)}</div><div class=m>${E(j.job_type)} · ${E(j.category)} · ${pay(j)}</div><p>${E(j.description).slice(0,160)}</p>${me.role!='employer'?`<button onclick="apply('${j.id}')">⚡ Apply in 1 tap</button><button class=g onclick="save('${j.id}')">${S.has(j.id)?'Unsave':'Save'}</button><button class=g onclick="chat('${j.employer_id}')">Message</button><button class=g onclick="report('${j.id}')">Report</button>`:''}</div>`};
async function apply(id){const m='';const j=J[id];
 const{error}=await sb.from('applications').insert({job_id:id,worker_id:me.id,message:m});
 if(error)return toast(error.code=='23505'?'Already applied':error.message);
 notify(j.employer_id,`${me.full_name} applied for ${j.title}`);toast('Applied ✓ Employers can see your profile and documents')}
async function save(id){const S=await saved();S.has(id)?await sb.from('saved_jobs').delete().eq('user_id',me.id).eq('job_id',id):await sb.from('saved_jobs').insert({user_id:me.id,job_id:id});V[tab]()}
const V={
async home(){
 if(me.role=='employer'){
  const c=async q=>(await q).count||0;
  const o=await c(sb.from('jobs').select('*',{count:'exact',head:true}).eq('employer_id',me.id).eq('status','open'));
  const p=await c(sb.from('applications').select('*',{count:'exact',head:true}).eq('status','pending'));
  app.innerHTML=`<h2>Welcome, ${E(me.full_name)}</h2><div class=row><div class=c><h1>${o}</h1><span class=m>Open jobs</span></div><div class=c><h1>${p}</h1><span class=m>Applicants to review</span></div></div><button onclick="go('post')">Post a job</button><button class=g onclick="go('jobs')">Manage jobs</button>`;return}
 let q=sb.from('jobs').select('*,profiles(full_name,verified,avatar_url)').eq('status','open');
 if(me.country)q=q.or(`country.eq.${me.country},remote.eq.true`);
 const{data}=await q.order('created_at',{ascending:false}).limit(8);const S=await saved();
 app.innerHTML=`<h2>Hello, ${E(me.full_name)} 👋</h2><div class=row><input id=hq placeholder="Search jobs, skills or categories" onkeydown="if(event.key==='Enter')homeSearch()"><button style="flex:0" onclick="homeSearch()">Search</button></div><p class=m>Newest jobs in ${E(me.country)} and remote</p>${(data||[]).map(j=>jobCard(j,S)).join('')||'<div class=c>No jobs yet. Try Jobs to search worldwide.</div>'}`},
async find(){
 app.innerHTML=`<h2>Find jobs</h2><input id=q value="${E(window._q||'')}" oninput="deb(runFind)" placeholder="Search title, description, skills"><div class=row><select id=cat onchange="runFind()"><option value="">All categories</option>${opt(CATS)}</select><select id=ty onchange="runFind()"><option value="">All types</option>${opt(TYPES)}</select></div><div class=row><select id=co onchange="runFind()"><option value="">Worldwide</option>${opt(CO,me.country)}</select><input id=ci oninput="deb(runFind)" placeholder="City"></div><label><input type=checkbox id=rm onchange="runFind()"> Remote jobs only</label><div id=res></div>`;window._q='';runFind()},
async work(){
 const{data:a}=await sb.from('applications').select('*,jobs(title,employer_id)').eq('worker_id',me.id).order('created_at',{ascending:false});
 const{data:s}=await sb.from('saved_jobs').select('jobs(*,profiles(full_name,verified,avatar_url))').eq('user_id',me.id);const S=new Set((s||[]).map(x=>x.jobs?.id));
 app.innerHTML=`<h2>My applications</h2>${(a||[]).map(x=>`<div class=c><b>${E(x.jobs?.title)}</b> <span class=tag>${E(x.status)}</span><div class=m>${new Date(x.created_at).toLocaleDateString()}</div><button class=g onclick="chat('${x.jobs?.employer_id}')">Message employer</button></div>`).join('')||'<div class=c>No applications yet.</div>'}<h2>Saved jobs</h2>${(s||[]).filter(x=>x.jobs).map(x=>jobCard(x.jobs,S)).join('')||'<div class=c>Nothing saved.</div>'}`},
async jobs(){
 const{data}=await sb.from('jobs').select('*').eq('employer_id',me.id).order('created_at',{ascending:false});
 app.innerHTML=`<h2>My jobs</h2><button onclick="go('post')">+ Post a job</button>${(data||[]).map(j=>{J[j.id]=j;return`<div class=c><b>${E(j.title)}</b> <span class=tag>${E(j.status)}</span><div class=m>${E(j.city)} ${E(j.country)} · ${E(j.job_type)} · ${pay(j)}</div><button onclick="applicants('${j.id}')">Applicants</button><select onchange="jobStatus('${j.id}',this.value)" style="width:auto">${opt(['open','paused','filled','expired'],j.status)}</select><button class=r onclick="delJob('${j.id}')">Delete</button></div>`}).join('')||'<div class=c>No jobs posted.</div>'}`},
async admin(){
 if(me.role!='admin')return go('home');
 const{data:S,error}=await sb.rpc('admin_stats');
 if(error)return app.innerHTML=`<div class=c>Admin data unavailable: ${E(error.message)}. Run the v3 SQL first.</div>`;
 const{data:U}=await sb.from('profiles').select('id,full_name,role,country,verified,suspended').order('created_at',{ascending:false}).limit(15);
 const{data:Jb}=await sb.from('jobs').select('id,title,status,country').order('created_at',{ascending:false}).limit(10);
 const{data:Rp}=await sb.from('reports').select('*,jobs(title)').eq('status','open').order('created_at',{ascending:false}).limit(10);
 const mx=Math.max(1,...(S.signups||[]).map(x=>x.n));const card=(l,v)=>`<div class=c><span class=m>${l}</span><h1>${v}</h1></div>`;
 app.innerHTML=`<h2>🛡️ Admin</h2><div class=row>${card('Users',S.users)}${card('Workers',S.workers)}</div><div class=row>${card('Employers',S.employers)}${card('Open jobs',S.jobs_open)}</div><div class=row>${card('Applications',S.applications)}${card('Messages',S.messages)}</div>
<div class=c><b>Sign-ups, last 14 days</b><div style="display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px">${(S.signups||[]).map(x=>`<div title="${x.d}: ${x.n}" style="flex:1;height:${Math.round(x.n/mx*100)}%;min-height:4px;background:var(--g);border-radius:4px"></div>`).join('')||'<span class=m>No sign-ups yet</span>'}</div></div>
<div class=c><b>Top countries</b>${(S.countries||[]).map(x=>`<div class=m>${E(x.c)} · ${x.n}</div>`).join('')}</div>
<h3>Open reports</h3>${(Rp||[]).map(r=>`<div class=c><b>${E(r.jobs?.title)}</b><div class=m>${E(r.reason)}</div><button class=r onclick="adminJob('${r.job_id}')">Remove job</button><button class=g onclick="closeReport('${r.id}')">Dismiss</button></div>`).join('')||'<div class=c>None 🎉</div>'}
<h3>Latest users</h3>${(U||[]).map(u=>`<div class=c><b>${E(u.full_name)}</b> <span class=tag>${E(u.role)}</span>${u.verified?'':' <span class=tag>flagged</span>'}${u.suspended?' <span class=tag>suspended</span>':''}<div class=m>${E(u.country)}</div>${u.role!='admin'?`<button class=g onclick="adminUser('${u.id}','verified',${!u.verified})">${u.verified?'Flag':'Unflag'}</button><button class=${u.suspended?'g':'r'} onclick="adminUser('${u.id}','suspended',${!u.suspended})">${u.suspended?'Unsuspend':'Suspend'}</button>`:''}</div>`).join('')}
<h3>Latest jobs</h3>${(Jb||[]).map(j=>`<div class=c><b>${E(j.title)}</b> <span class=tag>${E(j.status)}</span><div class=m>${E(j.country)}</div><button class=r onclick="adminJob('${j.id}')">Remove</button></div>`).join('')}`},
async workers(){
 app.innerHTML=`<h2>Find workers</h2><input id=wq oninput="deb(runWorkers)" placeholder="Skill, job title or keyword"><div class=row><select id=wc onchange="runWorkers()"><option value="">Worldwide</option>${opt(CO)}</select><input id=wi oninput="deb(runWorkers)" placeholder=City></div><label><input type=checkbox id=wa checked onchange="runWorkers()"> Available now only</label><div id=wres></div>`;runWorkers()},
post(){
 app.innerHTML=`<h2>Post a job</h2><input id=ti placeholder="Job title"><div class=row><select id=cat>${opt(CATS)}</select><select id=ty>${opt(TYPES)}</select></div><div class=row><input id=pa type=number placeholder="Pay (min)"><input id=pm type=number placeholder="Pay (max, optional)"></div><div class=row><select id=cu>${opt(CUR,'USD')}</select><select id=pp>${opt(PER,'month')}</select></div><label><input type=checkbox id=rm> Remote / work from anywhere</label><div class=row><select id=co>${cOpt(me.country)}</select><input id=ci placeholder=City value="${E(me.city)}"></div><textarea id=ds rows=4 placeholder="Description"></textarea><textarea id=rq rows=3 placeholder="Requirements"></textarea><button onclick="postJob()">Publish</button>`},
async msg(){
 const{data}=await sb.from('messages').select('*').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false}).limit(200);
 const L={};(data||[]).forEach(m=>{const o=m.sender_id==me.id?m.receiver_id:m.sender_id;if(!L[o])L[o]=m});
 const ids=Object.keys(L);const{data:p}=ids.length?await sb.from('profiles').select('id,full_name').in('id',ids):{data:[]};
 app.innerHTML=`<h2>Messages</h2>${ids.map(i=>`<div class=c onclick="chat('${i}')"><b>${E(p.find(x=>x.id==i)?.full_name)}</b><div class=m>${E(L[i].body).slice(0,60)}</div></div>`).join('')||'<div class=c>No conversations yet.</div>'}`},
async alerts(){
 const{data}=await sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(40);
 app.innerHTML=`<h2>Alerts</h2>${(data||[]).map(n=>`<div class=c style="${n.read?'opacity:.6':''}">${E(n.text)}<div class=m>${new Date(n.created_at).toLocaleString()}</div></div>`).join('')||'<div class=c>All caught up.</div>'}`;
 sb.from('notifications').update({read:true}).eq('user_id',me.id).eq('read',false).then(()=>{})},
me(){const W=me.role!='employer';
 app.innerHTML=`<div style="text-align:center">${av(me.avatar_url,me.full_name,96)}<br><input id=pic type=file accept="image/*" style="display:none" onchange="upPic()"><button class=g onclick="$('pic').click()">📷 Change photo</button></div><h2>Profile <span class=tag>${E(me.role)}</span></h2><input id=n value="${E(me.full_name)}" placeholder=Name><input id=h value="${E(me.headline)}" placeholder="${W?'Headline (e.g. Electrician, 5 yrs)':'Company / tagline'}"><textarea id=b rows=3 placeholder=Bio>${E(me.bio)}</textarea>${W?`<input id=sk value="${E(me.skills)}" placeholder="Skills, comma separated"><select id=av>${opt(['Available','Busy','Not looking'],me.availability)}</select>`:''}<div class=row><select id=co>${cOpt(me.country)}</select><input id=ci value="${E(me.city)}" placeholder=City></div><input id=lg value="${E(me.language)}" placeholder=Language><p class=m>Time zone: ${E(me.timezone||TZ)}</p><div id=docs></div><button onclick="saveProfile()">Save</button><button class=g onclick="legal()">Terms, privacy &amp; safety</button><button class=g onclick="logout()">Log out</button>`;if(W)loadDocs()}};
async function runFind(){
 let q=sb.from('jobs').select('*,profiles(full_name,verified,avatar_url)').eq('status','open');
 {const k=f('q').replace(/[,()%]/g,' ');if(k)q=q.or(`title.ilike.%${k}%,description.ilike.%${k}%,requirements.ilike.%${k}%,category.ilike.%${k}%`)}
 if(f('cat'))q=q.eq('category',f('cat'));if(f('ty'))q=q.eq('job_type',f('ty'));
 if($('rm').checked)q=q.eq('remote',true);else if(f('co'))q=q.or(`country.eq.${f('co')},remote.eq.true`);
 if(f('ci'))q=q.ilike('city',`%${f('ci').replace(/[,()%]/g,' ')}%`);
 const{data}=await q.order('created_at',{ascending:false}).limit(40);const S=await saved();
 $('res').innerHTML=(data||[]).map(j=>jobCard(j,S)).join('')||'<div class=c>No jobs match. Try fewer filters.</div>'}
async function postJob(){const rm=$('rm').checked;if(!f('ti'))return toast('Title required');if(!rm&&!f('co'))return toast('Pick a country or mark Remote');

terms:['Terms of Service',`<p>Last updated 25 October 2026. WorkLink is in an early testing stage and may change.</p><h3>1. What WorkLink is</h3><p>WorkLink is an online platform, operated from Kenya, where workers and employers can find and contact each other. WorkLink is not an employer, recruitment agency or staffing agency, and is not a party to any agreement between users. We do not guarantee any job, hire, income, or the accuracy, safety or reliability of any user, profile or listing.</p><h3>2. Who can use WorkLink</h3><p>You must be 18 or older and able to enter a binding agreement. Give accurate information and keep one account per person. If you act for a business, you confirm you have authority to do so.</p><h3>3. Your account</h3><p>Keep your password private and tell us at once if you think someone else has access. You are responsible for activity on your account. We may sign you out or suspend an account to protect users.</p><h3>4. What WorkLink does not verify</h3><p>WorkLink does not currently verify the identity, business registration, qualifications, work permits or reliability of any user or listing. Accounts can be created without confirming an email address. A "Flagged by admin" label only means we have marked an account or listing as suspicious or under review. The absence of a label is not a sign that a job or person is safe.</p><h3>5. Job listings</h3><p>Listings must be real, lawful and accurate, including the title, duties, location, pay, currency, pay period and job type. Listings must not ask applicants for money, deposits or purchases, and must not discriminate unlawfully. Keep listings up to date and close them when filled. We may edit or remove listings that break these terms.</p><h3>6. Hiring and working</h3><p>Employers are responsible for lawful employment, including pay, tax, safety and work permits. Workers are responsible for the accuracy of their profile and qualifications and for their legal right to do the work. Any work agreement is only between the employer and the worker. WorkLink is not responsible for the quality, pay, safety or outcome of any work.</p><h3>7. Acceptable use</h3><p>You must follow the Community Rules. In particular, do not post fake jobs or profiles, harass or threaten anyone, collect other users' data without permission, send malware or phishing links, or try to disrupt or misuse the service.</p><h3>8. Your content</h3><p>You own what you post. You allow WorkLink to store, display and process it to run the service, as described in the Privacy Policy. You confirm you have the right to share it. We may remove content that breaks these terms.</p><h3>9. Suspension and termination</h3><p>We may remove content, warn, suspend or permanently close accounts that break these terms, create risk for others, or where the law requires. You can stop using WorkLink at any time and ask us to delete your account (see the Privacy Policy). If you believe a decision was a mistake, email us within 14 days with your account email and an explanation, and we will review it.</p><h3>10. Payments</h3><p>WorkLink does not process, hold, protect or guarantee payments between users. Workers and employers arrange pay themselves, at their own risk. WorkLink currently charges no fees. If payments or paid features are added later, they will have their own terms and notice.</p><h3>11. Service availability</h3><p>WorkLink is an early test version provided as is and as available. It may change, pause or lose data, and we do not currently guarantee backups. Do not rely on WorkLink as your only record of anything important.</p><h3>12. Limit of liability</h3><p>As far as the law allows, WorkLink is not liable for the conduct of users, for listings or profiles, for lost income or opportunities, for data loss, or for indirect or consequential losses. Nothing in these terms limits any liability that cannot be limited by law, or your mandatory consumer rights.</p><h3>13. Disputes</h3><p>Disputes between users, including about pay or work, are for those users to resolve. We may review reports and take action on accounts, but we do not mediate or decide pay disputes. If you have a complaint about WorkLink, email us first and we will try to resolve it in good faith.</p><h3>14. Changes</h3><p>We may update these terms. We will change the date above and, for major changes, try to tell users in the app or by email. Using WorkLink after a change means you accept the updated terms.</p><h3>15. Governing law</h3><p>These terms are governed by the laws of Kenya, without removing any mandatory legal rights you have where you live.</p><h3>16. Contact</h3><p>Email: worklinksupportservices@gmail.com</p>`],
privacy:['Privacy Policy',`<p>Last updated 25 October 2026. This policy explains how WorkLink handles personal information in its early testing stage.</p><h3>Who we are</h3><p>WorkLink is operated from Kenya by its developer ("we"). Contact: worklinksupportservices@gmail.com</p><h3>What we collect</h3><ul><li>Account details: email address and password. Passwords are handled by Supabase Authentication, so we do not see or store them in plain text. If you choose Continue with Google, Google shares your name and email address with us.</li><li>Profile details: name, role (worker or employer), country, city, language, time zone, headline, bio, skills, availability and profile photo.</li><li>Activity: job listings, applications and application messages, chat messages, notifications, reports you send, and the date you accepted our terms.</li><li>Documents: CVs, certificates and similar files you upload.</li><li>Technical data: IP address, device and browser information, and timestamps in our providers' logs. Your login session is kept in your browser storage.</li></ul><p>We do not collect payment details, because WorkLink does not process payments. We do not currently use advertising or analytics trackers.</p><h3>Why we use it</h3><p>To create and secure your account, run the marketplace (profiles, listings, applications, messages, alerts), send account emails such as password resets, review reports and prevent abuse, and meet legal duties. Where the law requires a legal basis, we rely on providing the service you asked for, our legitimate interests in safety and security, your consent (for example when you upload documents), and legal obligations.</p><h3>Who can see your information</h3><ul><li>Logged-in users can see worker profiles (name, headline, bio, skills, city, country, availability, photo) and job listings with the employer's name and photo. Your email address is not shown to other users.</li><li>An employer can see your application and can open your uploaded documents only if you applied to one of their jobs.</li><li>Messages can be seen by the two people in the conversation. Messages are not end-to-end encrypted.</li><li>Profile photos are stored so that anyone with the image link can view it. Documents are stored privately.</li><li>Administrators can see reports and account information needed to moderate. People with access to our Supabase dashboard could technically view stored data, including messages and files. Access is limited to the developer and administrators.</li></ul><h3>Service providers</h3><ul><li>Supabase: database, authentication, file storage and logs.</li><li>Mailjet: sends sign-up and password-reset emails, so it processes your email address.</li><li>GitHub Pages: hosts the website and may log visitors' technical data.</li><li>Google: only if you choose Continue with Google.</li><li>jsDelivr: delivers a code library used by the website and may see your IP address.</li></ul><p>Your data may be stored or processed in countries other than yours. Providers have their own privacy policies.</p><h3>Security</h3><p>We use HTTPS, database access rules that limit what each user can read, and private storage for documents. No online service is completely secure, and we cannot guarantee absolute security.</p><h3>How long we keep it</h3><p>We keep your information until you ask us to delete it or we remove your account. We do not currently delete inactive accounts automatically. Provider logs follow the providers' own retention. We do not currently run guaranteed backups.</p><h3>Your rights and how to use them</h3><p>You can edit your profile in the app. You can also ask us to give you a copy of your information, correct it, delete it, or stop or limit its use, as the law in your country allows. Email worklinksupportservices@gmail.com from the address on your account with the subject "WorkLink data request". We may ask you to confirm your identity. We aim to reply within 30 days.</p><h3>Account deletion</h3><p>Account deletion is currently handled by request, not inside the app. When we delete an account, we remove your profile, job listings, applications, notifications, uploaded documents and photo. Messages you sent or received are deleted too, so the other person will no longer see them. We may keep limited information where needed to meet a legal obligation, investigate fraud, abuse or safety reports, or handle a dispute. Copies in provider logs may remain until they expire.</p><h3>Kenya and other laws</h3><p>We aim to handle personal data in line with Kenya's Data Protection Act, 2019, and to respect the rights it gives you. We do not claim full legal compliance at this early stage. If you live in a place where laws such as the GDPR apply to us, we will respect the rights those laws give you. You can complain to Kenya's Office of the Data Protection Commissioner or to your local data protection authority.</p><h3>Children</h3><p>WorkLink is for people 18 and over. Contact us if you believe a child has created an account.</p><h3>Future features</h3><p>WorkLink does not currently offer payments, advertising, verified credentials or AI features. If we add them, we will update this policy and tell users first.</p><h3>Changes</h3><p>We may update this policy and will change the date above. For major changes we will try to tell users in the app or by email.</p>`],
rules:['Community Rules',`<p>Last updated 25 October 2026. These rules apply to everyone on WorkLink.</p><h3>Be honest</h3><p>Use your real details. Post only real jobs, real profiles and accurate pay, duties, location and working conditions.</p><h3>Never charge to hire or get hired</h3><p>No application fees, recruitment deposits, paid starter kits, training fees or any request for money to get or keep a job.</p><h3>Not allowed</h3><ul><li>Fraudulent or fake profiles, fake jobs, or misleading pay or conditions</li><li>Impersonating a person or business</li><li>Harassment, threats, discrimination or hate</li><li>Phishing, malware, or collecting other people's data without permission</li><li>Sharing someone's private information without their consent</li><li>Exploitation, human trafficking, forced labour or any illegal work</li><li>Fake or paid reviews, if reviews are added</li><li>Trying to disrupt, overload, bypass or abuse WorkLink</li></ul><h3>Reporting</h3><p>Use the Report button on a job listing. For anything else, such as a profile, a message or a safety concern, email worklinksupportservices@gmail.com. Include screenshots and the name of the account. WorkLink does not currently have in-app reporting for profiles or messages.</p><h3>What we may do</h3><p>Depending on how serious the problem is, we may remove content, send a warning, temporarily suspend an account, or permanently close it. For serious risk to others we may act without warning, and we may share information with authorities where the law requires.</p><h3>Appeals</h3><p>If you think we made a mistake, email worklinksupportservices@gmail.com within 14 days with your account email and an explanation. A different review of the decision will be done where possible, and we will reply with the outcome. Some decisions may be final.</p>`],
safety:['Job Safety Tips',`<p>Last updated 25 October 2026. WorkLink does not verify identity, businesses, qualifications or reliability, so please protect yourself.</p><h3>If you are looking for work</h3><ul><li>Never pay money to get a job, an interview, training, a uniform or "registration." Real employers do not charge you.</li><li>Be careful with pay that sounds too good to be true, or offers that arrive before any real conversation.</li><li>Check the employer: search the business name, ask for a website or registration number, and ask to speak to a real person.</li><li>Meet in a public place first and tell someone you trust where you are going.</li><li>Agree duties, hours and pay in writing before you start, including when and how you will be paid.</li></ul><h3>If you are hiring</h3><ul><li>Check identity and the right to work before you hire.</li><li>Agree duties, pay, hours and deadlines in writing and pay on time and fairly.</li><li>Keep workers' CVs and documents private, and never share them without permission.</li></ul><h3>Protect your accounts and documents</h3><ul><li>Use a strong, unique password and never share it.</li><li>Never share one-time codes, bank or mobile-money PINs, or ID numbers.</li><li>Do not upload ID numbers or bank details to WorkLink. Share sensitive documents only when you are sure it is needed.</li></ul><h3>Warning signs</h3><p>Pressure to decide quickly, requests to move to private chats, payment requests, cheques or "equipment" purchases, requests for ID or bank details before an offer, links to strange websites, or listings that keep changing details.</p><h3>If something goes wrong</h3><ul><li>Stop communicating and do not send more money or information.</li><li>Save evidence: screenshots, messages, receipts and phone numbers.</li><li>Report the listing with the Report button, or email worklinksupportservices@gmail.com for anything else.</li><li>If you lost money, contact your bank or mobile-money provider and the police or the relevant authority in your country.</li></ul><h3>Remember</h3><p>A "Flagged by admin" label means we have marked something as suspicious. No label does not mean something is safe.</p>`]};
