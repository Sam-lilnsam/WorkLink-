ent is only between the employer and the worker. WorkLink is not responsible for the quality, pay, safety or outcome of any work.</p><h3>7. Acceptable use</h3><p>You must follow the Community Rules. In particular, do not post fake jobs or profiles, harass or threaten anyone, collect other users' data without permission, send malware or phishing links, or try to disrupt or misuse the service.</p><h3>8. Your content</h3><p>You own what you post. You allow WorkLink to store, display and process it to run the service, as described in the Privacy Policy. You confirm you have the right to share it. We may remove content that breaks these terms.</p><h3>9. Suspension and termination</h3><p>We may remove content, warn, suspend or permanently close accounts that break these terms, create risk for others, or where the law requires. You can stop using WorkLink at any time and ask us to delete your account (see the Privacy Policy). If you believe a decision was a mistake, email us within 14 days with your account email and an explanation, and we will review it.</p><h3>10. Payments</h3><p>WorkLink does not process, hold, protect or guarantee payments between users. Workers and employers arrange pay themselves, at their own risk. WorkLink currently charges no fees. If payments or paid features are added later, they will have their own terms and notice.</p><h3>11. Service availability</h3><p>WorkLink is an early test version provided as is and as available. It may change, pause or lose data, and we do not currently guarantee backups. Do not rely on WorkLink as your only record of anything important.</p><h3>12. Limit of liability</h3><p>As far as the law allows, WorkLink is not liable for the conduct of users, for listings or profiles, for lost income or opportunities, for data loss, or for indirect or consequential losses. Nothing in these terms limits any liability that cannot be limited by law, or your mandatory consumer rights.</p><h3>13. Disputes</h3><p>Disputes between users, privacy:['Privacy Policy',`<p>Last updated 25 October 2026. This policy explains how WorkLink handles personal information in its early testing stage.</p><h3>Who we are</h3><p>WorkLink is operated from Kenya by its developer ("we"). Contact: worklinksupportservices@gmail.com</p><h3>What we collect</h3><ul><li>Account details: email address and password. Passwords are handled by Supabase Authentication, so we do not see or store them in plain text. If you choose Continue with Google, Google shares your name and email address with us.</li><li>Profile details: name, role (worker or employer), country, city, language, time zone, headline, bio, skills, availability and profile photo.</li><li>Activity: job listings, applications and application messages, chat messages, notifications, reports you send, and the date you accepted our terms.</li><li>Documents: CVs, certificates and similar files you upload.</li><li>Technical data: IP address, device and browser information, and timestamps in our providers' logs. Your login session is kept in your browser storage.</li></ul><p>We do not collect payment details, because WorkLink does not process payments. We do not currently use advertising or analytics trackers.</p><h3>Why we use it</h3><p>To create and secure your account, run the marketplace (profiles, listings, applications, messages, alerts), send account emails such as password resets, review reports and prevent abuse, and meet legal duties. Where the law requires a legal basis, we rely on providing the service you asked for, our legitimate interests in safety and security, your consent (for example when you upload documents), and legal obligations.</p><h3>Who can see your information</h3><ul><li>Logged-in users can see worker profiles (name, headline, bio, skills, city, country, availability, photo) and job listings with the employer's name and photo. Your email address is not shown to other users.</li><li>An employer can see your application and can open your uploaded documents only if you applied to one of their jobs.</li><li>Messages can be seen by the two people in the conversation. Messages are not end-to-end encrypted.</li><li>Profile photos are stored so that anyone with the image link can view it. Documents are stored privately.</li><li>Administrators can see reports and account information needed to moderate. People with access to our Supabase dashboard could technically view stored data, including messages and files. Access is limited to the developer and administrators.</li></ul><h3>Service providers</h3><ul><li>Supabase: database, authentication, file storage and logs.</li><li>Mailjet: sends sign-up and password-reset emails, so it processes your email address.</li><li>GitHub Pages: hosts the website and may log visitors' technical data.</li><li>Google: only if you choose Continue with Google.</li><li>jsDelivr: delivers a code library used by the website and may see your IP address.</li></ul><p>Your data may be stored or processed in countries other than yours. Providers have their own privacy policies.</p><h3>Security</h3><p>We use HTTPS, database access rules that limit what each user can read, and private storage for documents. No online service is completely secure, and we cannot guarantee absolute security.</p><h3>How long we keep it</h3><p>We keep your information until you ask us to delete it or we remove your account. We do not currently delete inactive accounts automatically. Provider logs follow the providers' own retention. We do not currently run guaranteed backups.</p><h3>Your rights and how to use them</h3><p>You can edit your profile in the app. You can also ask us to give you a copy of your information, correct it, delete it, or stop or limit its use, as the law in your country allows. Email worklinksupportservices@gmail.com from the address on your account with the subject "WorkLink data request". We may ask you to confirm your identity. We aim to reply within 30 days.</p><h3>Account deletion</h3><p>You can delete your account inside the app (Profile, then Delete my account) or ask us by email. When an account is deleted, we remove your profile, job listings, applications, notifications, uploaded documents and photo. When an employer removes a job without deleting their account, the listing is hidden but its applications are kept so both sides keep their records. Messages you sent or received are deleted too, so the other person will no longer see them. We may keep limited information where needed to meet a legal obligation, investigate fraud, abuse or safety reports, or handle a dispute. Copies in provider logs may remain until they expire.</p><h3>Kenya and other laws</h3><p>We aim to handle personal data in line with Kenya's Data Protection Act, 2019, and to respect the rights it gives you. We do not claim full legal compliance at this early stage. If you live in a place where laws such as the GDPR apply to us, we will respect the rights those laws give you. You can complain to Kenya's Office of the Data Protection Commissioner or to your local data protection authority.</p><h3>Children</h3><p>WorkLink is for people 18 and over. Contact us if you believe a child has created an account.</p><h3>Future features</h3><p>WorkLink does not currently offer payments, advertising, verified credentials or AI features. If we add them, we will update this policy and tell users first.</p><h3>Changes</h3><p>We may update this policy and will change the date above. For major changes we will try to tell users in the app or by email.</p>`],
rules:['Community Rules',`<p>Last updated 25 October 2026. These rules apply to everyone on WorkLink.</p><h3>Be honest</h3><p>Use your real details. Post only real jobs, real profiles and accurate pay, duties, location and working conditions.</p><h3>Never charge to hire or get hired</h3><p>No application fees, recruitment deposits, paid starter kits, training fees or any request for money to get or keep a job.</p><h3>Not allowed</h3><ul><li>Fraudulent or fake profiles, fake jobs, or misleading pay or conditions</li><li>Impersonating a person or business</li><li>Harassment, threats, discrimination or hate</li><li>Phishing, malware, or collecting other people's data without permission</li><li>Sharing someone's private information without their consent</li><li>Exploitation, human trafficking, forced labour or any illegal work</li><li>Fake or paid reviews, if reviews are added</li><li>Trying to disrupt, overload, bypass or abuse WorkLink</li></ul><h3>Reporting</h3><p>Use the Report button on a job listing. For anything else, such as a profile, a message or a safety concern, email worklinksupportservices@gmail.com. Include screenshots and the name of the account. WorkLink does not currently have in-app reporting for profiles or messages.</p><h3>What we may do</h3><p>Depending on how serious the problem is, we may remove content, send a warning, temporarily suspend an account, or permanently close it. For serious risk to others we may act without warning, and we may share information with authorities where the law requires.</p><h3>Appeals</h3><p>If you think we made a mistake, email worklinksupportservices@gmail.com within 14 days with your account email and an explanation. A different review of the decision will be done where possible, and we will reply with the outcome. Some decisions may be final.</p>`],
safety:['Job Safety Tips',`<p>Last updated 25 October 2026. WorkLink does not verify identity, businesses, qualifications or reliability, so please protect yourself.</p><h3>If you are looking for work</h3><ul><li>Never pay money to get a job, an interview, training, a uniform or "registration." Real employers do not charge you.</li><li>Be careful with pay that sounds too good to be true, or offers that arrive before any real conversation.</li><li>Check the employer: search the business name, ask for a website or registration number, and ask to speak to a real person.</li><li>Meet in a public place first and tell someone you trust where you are going.</li><li>Agree duties, hours and pay in writing before you start, including when and how you will be paid.</li></ul><h3>If you are hiring</h3><ul><li>Check identity and the right to work before you hire.</li><li>Agree duties, pay, hours and deadlines in writing and pay on time and fairly.</li><li>Keep workers' CVs and documents private, and never share them without permission.</li></ul><h3>Protect your accounts and documents</h3><ul><li>Use a strong, unique password and never share it.</li><li>Never share one-time codes, bank or mobile-money PINs, or ID numbers.</li><li>Do not upload ID numbers or bank details to WorkLink. Share sensitive documents only when you are sure it is needed.</li></ul><h3>Warning signs</h3><p>Pressure to decide quickly, requests to move to private chats, payment requests, cheques or "equipment" purchases, requests for ID or bank details before an offer, links to strange websites, or listings that keep changing details.</p><h3>If something goes wrong</h3><ul><li>Stop communicating and do not send more money or information.</li><li>Save evidence: screenshots, messages, receipts and phone numbers.</li><li>Report the listing with the Report button, or email worklinksupportservices@gmail.com for anything else.</li><li>If you lost money, contact your bank or mobile-money provider and the police or the relevant authority in your country.</li></ul><h3>Remember</h3><p>A "Flagged by admin" label means we have marked something as suspicious. No label does not mean something is safe.</p>`]};

async function delJob(id){if(!await dlg({title:'Remove this job?',msg:'It will be hidden from workers. Applications are kept for your records.',ok:'Remove',danger:1}))return;await sb.from('jobs').update({status:'removed'}).eq('id',id);toast('Job removed');go('jobs')}
async function adminJob(id){if(!await dlg({title:'Remove this job?',msg:'It will be hidden from all workers.',ok:'Remove',danger:1}))return;await sb.from('jobs').update({status:'removed'}).eq('id',id);V.admin()}
async function report(id){const r=await dlg({title:'Report this job',msg:'What is wrong with it? For example: fake, asks for money, offensive.',input:'area',ok:'Send report'});if(!r)return;const{error}=await sb.from('reports').insert({reporter_id:me.id,job_id:id,reason:r});toast(error?error.message:'Report sent. Thank you.')}
async function delDoc(id,p){if(!await dlg({title:'Delete this document?',msg:'Employers will no longer be able to open it.',ok:'Delete',danger:1}))return;await sb.storage.from('docs').remove([p]);await sb.from('documents').delete().eq('id',id);loadDocs()}
async function delAccount(){if(me.role=='admin')return toast('Admin accounts cannot be deleted here');
 if(!await dlg({title:'Delete your account?',msg:'This permanently deletes your profile, jobs, applications, messages and files. Type DELETE to confirm.',input:1,expect:'DELETE',ok:'Delete forever',danger:1}))return;
 try{for(const b of ['docs','avatars']){const{data:fl}=await sb.storage.from(b).list(me.id);if(fl&&fl.length)await sb.storage.from(b).remove(fl.map(x=>`${me.id}/${x.name}`))}}catch(e){}
 const{error}=await sb.rpc('delete_my_account');if(error)return toast(error.message);
 await sb.auth.signOut();me=null;authView('login');toast('Your account was deleted')}
async function loadDocs(){const{data}=await sb.from('documents').select('*').eq('user_id',me.id).order('created_at',{ascending:false});if(!$('docs'))return;
 $('docs').innerHTML=`<h3>My documents</h3><div class=c><p class=m style="margin-top:0">Add your CV or certificates (PDF, Word or photo, max 5 MB). Employers can open them only after you apply to their job. Do not upload ID numbers or bank details.</p>${(data||[]).map(d=>`<div class=rt style="padding:6px 0;border-top:1px solid var(--ln)"><span class=ln><b>${E(d.doc_type)}</b> <span class=m>${E(d.name)}</span></span>${menu(`<button onclick="openDoc('${d.path}')">View</button><button class=dg onclick="delDoc('${d.id}','${d.path}')">Delete</button>`)}</div>`).join('')}<label class=fld><span>Type</span><select id=dtp>${opt(['CV / Resume','Certificate','Cover letter','Reference letter','Other'])}</select></label><input id=dfl type=file accept=".pdf,.doc,.docx,image/*"><button class=g style="margin-top:8px" onclick="upDoc()">Upload document</button></div>`}
async function saveProfile(){if(!f('n'))return toast('Name is required');const u={full_name:f('n'),headline:f('h'),bio:f('b'),country:f('co'),city:f('ci'),language:f('lg')};
 if($('sk')){u.skills=f('sk');u.availability=f('av')}
 const{error}=await sb.from('profiles').update(u).eq('id',me.id);error?toast(error.message):(Object.assign(me,u),toast('Saved ✓'),V.me())}
async function chat(uid){clearInterval(poll);
 const{data:p}=await sb.from('profiles').select('full_name,avatar_url').eq('id',uid).single();
 app.innerHTML=`<div class=row style="flex-wrap:nowrap;gap:10px;margin-bottom:6px"><button class="g sm" style="flex:0 0 auto;min-width:0" aria-label="Back to messages" onclick="go('msg')">←</button>${av(p?.avatar_url,p?.full_name,36)}<b class="g1 ln">${E(p?.full_name||'User')}</b></div><div id=log></div><div class=cmp><input id=mb placeholder="Type a message" aria-label="Message" onkeydown="if(event.key==='Enter')sendMsg('${uid}')"><button onclick="sendMsg('${uid}')">Send</button></div>`;
 const draw=async()=>{const{data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${uid}),and(sender_id.eq.${uid},receiver_id.eq.${me.id})`).order('created_at');
  const l=$('log');if(!l)return clearInterval(poll);const end=l.scrollTop+l.clientHeight>=l.scrollHeight-40;l.innerHTML=(data||[]).map(m=>`<div class="b ${m.sender_id==me.id?'me':''}">${E(m.body)}<div style="font-size:10px;opacity:.7">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class=em>Say hello 👋</div>';if(end)l.scrollTop=l.scrollHeight};
 draw();sb.from('messages').update({read_at:new Date().toISOString()}).eq('receiver_id',me.id).eq('sender_id',uid).is('read_at',null).then(()=>badges());poll=setInterval(draw,4000);window._draw=draw}
function legal(k){
 if(!k||!LG[k])return app.innerHTML=`<button class="g sm" onclick="back()">← Back</button>`+hd('Terms, privacy &amp; safety','Last updated '+LAST).replace('class=hd','class=hd style="margin-top:10px"')+Object.keys(LG).map(x=>`<div class=li onclick="legal('${x}')"><b class=g1>${LG[x][0]}</b>›</div>`).join('');
 app.innerHTML=`<button class="g sm" onclick="legal()">← All documents</button><div class=hd style="margin-top:10px"><h1>${LG[k][0]}</h1></div><div class="c legal">${LG[k][1]}</div><p class=m>Contact: ${E(CONTACT)}</p>`}

async function adminUsersList(){const k=($('aq')?.value||'').trim().replace(/[,()%*]/g,' ');
 let q=sb.from('profiles').select('id,full_name,role,country,verified,suspended,created_at').order('created_at',{ascending:false}).limit(40);if(k)q=q.ilike('full_name',`%${k}%`);
 const{data,error}=await q;if(!$('ul'))return;if(error)return $('ul').innerHTML=errBox(error.message);
 $('ul').innerHTML=(data||[]).map(u=>`<div class=li style="cursor:default"><div class=g1><div class=rt><b class=ln>${E(u.full_name)}</b><span>${bd(u.role)}${u.verified?'':' '+bd('Flagged')}${u.suspended?' '+bd('Suspended'):''}</span></div><div class="m ln">${E(u.country||'')} · joined ${ago(u.created_at)}</div></div>${u.role!='admin'?menu(`<button onclick="adminUser('${u.id}','verified',${!u.verified})">${u.verified?'Flag account':'Remove flag'}</button><button class=dg onclick="adminUser('${u.id}','suspended',${!u.suspended})">${u.suspended?'Unsuspend':'Suspend'}</button>`):''}</div>`).join('')||empty('users','No users found','Try a different name.')}
boot();
</script></body></html>
